<div id="confirmModal" class="modal-overlay">

    <div class="modal-box">

        <div id="modalMessage">
            Lưu ID mới?
        </div>

        <div class="modal-buttons">

            <button id="confirmSaveBtn" class="modal-confirm">
                Xác nhận
            </button>

            <button onclick="closeModal()" class="modal-cancel">
                Hủy
            </button>

        </div>

    </div>

</div>

<!-- Overlay xem ảnh theme -->
<div id="imageOverlay" class="image-overlay" style="display:none;">
    <div class="image-overlay-backdrop" onclick="closeImageOverlay()"></div>
    <div class="image-overlay-content">
        <img id="overlayImage" src="" alt="Theme preview">
        <button type="button" class="image-overlay-close" onclick="closeImageOverlay()">×</button>
    </div>
</div>

<div id="videoOverlay" class="audio-overlay" style="display:none;">
    <div class="audio-overlay-backdrop" onclick="closeVideoOverlay()"></div>
    <div class="audio-overlay-content" style="max-width: 980px; width: calc(100% - 40px);">
        <div id="videoTitle" class="audio-title">Xem video</div>
        <video id="videoPlayer" controls style="width: 100%; margin-top: 10px; max-height: 70vh; background: #000;"></video>
        <div id="videoUnsupportedMsg" style="display: none; text-align: center; color: #fff; font-size: 16px; margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 8px;">
            Video không được hỗ trợ trên trình duyệt này.
            <br><br>
            <button id="openVlcBtn" style="margin-top: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Mở bằng VLC</button>
        </div>
        <button type="button" class="audio-overlay-close" onclick="closeVideoOverlay()">×</button>
    </div>
</div>

<!-- Overlay nghe thử nhạc -->
<div id="audioOverlay" class="audio-overlay" style="display:none;">
    <div class="audio-overlay-backdrop" onclick="closeAudioOverlay()"></div>
    <div class="audio-overlay-content">
        <div id="audioTitle" class="audio-title">Nghe thử nhạc</div>
        <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px;">
            Trình duyệt không hỗ trợ audio.
        </audio>
        <button type="button" class="audio-overlay-close" onclick="closeAudioOverlay()">×</button>
    </div>
</div>

<!-- Overlay xác nhận xóa nhạc -->
<div id="deleteMusicModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div id="deleteMusicMessage">
            Xóa file nhạc này?
        </div>
        <div class="modal-buttons" id="deleteMusicButtons">
            <button type="button" class="modal-confirm" onclick="confirmDeleteMusic()">Xác nhận</button>
            <button type="button" class="modal-cancel" onclick="closeDeleteMusicModal()">Hủy</button>
        </div>
    </div>
</div>

<!-- Overlay đặt tên file nhạc khi thêm mới -->
<div id="saveMusicNameModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div id="saveMusicNameMessage">Đặt tên file nhạc sẽ được lưu</div>
        <input id="saveMusicNameInput" class="input-control" type="text" style="margin-top: 10px;" />
        <div class="modal-buttons" style="margin-top: 12px;">
            <button id="saveMusicNameConfirmBtn" type="button" class="modal-confirm">Lưu</button>
            <button id="saveMusicNameCancelBtn" type="button" class="modal-cancel">Hủy</button>
        </div>
    </div>
</div>

<div id="uninstallConfirmModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div id="uninstallConfirmMessage">Bạn có chắc muốn gỡ cài đặt không?</div>
        <div class="modal-buttons" style="margin-top: 12px;">
            <button id="uninstallConfirmBtn" type="button" class="modal-confirm">Xác nhận</button>
            <button id="uninstallCancelBtn" type="button" class="modal-cancel">Hủy</button>
        </div>
    </div>
</div>
